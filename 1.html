<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Flow Pro | Ultimate Planner & Focus Hub</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    .kaa {
      color:#fff;
      text-decoration: none;
    }
    .kaa :hover {
       color: #ef4444;
    }
    .kaa :visited {
      color: #10b981;
    }

    :root {
      --bg: #090d16;
      --panel: #111827;
      --panel-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 40%);
    }

    .app-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ШАПКА */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      padding: 20px 28px;
      border-radius: var(--radius);
      flex-wrap: wrap;
      gap: 16px;
    }

    .date-display h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .date-display p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }

    .header-badges {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .streak-badge {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--warning);
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stats-badge {
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.88rem;
    }

    /* ПРОГРЕСС БАР ДНЯ */
    .day-progress-container {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--panel-border);
      height: 10px;
      border-radius: 10px;
      overflow: hidden;
      width: 100%;
    }

    .day-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--success));
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    /* BENTO GRID */
    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .grid-layout { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* TASKS */
    .task-input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"], textarea, select {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    .task-input-row input { flex: 1; }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .filters { display: flex; gap: 8px; }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      transition: all 0.2s;
    }

    .task-item:hover { background: rgba(255, 255, 255, 0.04); }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .checkbox {
      width: 20px; height: 20px;
      border-radius: 6px;
      border: 2px solid var(--text-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }

    .task-item.completed .checkbox {
      background: var(--success);
      border-color: var(--success);
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-text { font-size: 0.95rem; font-weight: 500; }

    .tag {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
    }

    .delete-btn {
      background: none; border: none;
      color: var(--text-muted);
      cursor: pointer; font-size: 1.1rem; padding: 4px;
    }

    .delete-btn:hover { color: var(--danger); }

    /* POMODORO */
    .pomodoro-box {
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }

    .timer-display {
      font-size: 3.2rem;
      font-weight: 800;
      font-family: monospace;
      letter-spacing: -1px;
      margin: 6px 0;
    }

    .timer-controls { display: flex; gap: 10px; width: 100%; }
    .timer-controls .btn { flex: 1; }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    /* SOUNDS PLAYER (NEW) */
    .sound-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }

    .sound-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sound-btn.active {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--accent);
      color: var(--text);
    }

    /* NOTES & HABITS */
    textarea.notes-area {
      width: 100%; height: 110px; resize: none; line-height: 1.5;
    }

    .habits-list { display: flex; flex-direction: column; gap: 8px; }

    .habit-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 10px;
      border: 1px solid var(--panel-border);
    }

    .habit-check {
      width: 28px; height: 28px; border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }

    .habit-check.done {
      background: var(--success); color: #fff; border-color: var(--success);
    }

  </style>
</head>
<body>

  <div class="app-container">

    <!-- ШАПКА -->
    <header class="header-bar">
      <div class="date-display">
        <h1 id="current-date">Сегoодня</h1>
        <p>Кайдзен: шаг за шаг за шагом каждый день</p>
      </div>

      <div class="header-badges">
        <div class="streak-badge" id="streak-counter">
          🔥 1 день серии
        </div>
        <div class="stats-badge" id="completion-stats">
          0% выполнено
        </div>
      </div>
    </header>

    <!-- ИНДИКАТОР ПРОГРЕССА ДНЯ -->
    <div class="day-progress-container">
      <div class="day-progress-bar" id="progress-bar"></div>
    </div>

    <!-- ОСНОВНАЯ СЕТКА -->
    <div class="grid-layout">

      <!-- ЛЕВАЯ КОЛОНКА: ЗАДАЧИ -->
      <div class="card">
        <div class="card-title">
          <span>Задачи Дня</span>
          <div class="filters">
            <button class="filter-btn active" onclick="filterTasks('all')">Все</button>
            <button class="filter-btn" onclick="filterTasks('active')">В работе</button>
            <button class="filter-btn" onclick="filterTasks('completed')">Готовые</button>
          </div>
        </div>

        <div class="task-input-row">
          <input type="text" id="task-input" placeholder="Добавить новую задачу..." onkeydown="if(event.key==='Enter') addTask()">
          <select id="task-tag">
            <option value="Учеба">Учеба</option>
            <option value="Код">Код</option>
            <option value="English">English</option>
            <option value="Трейдинг">Трейдинг</option>
            <option value="Спорт">Спорт</option>
          </select>
          <button class="btn" onclick="addTask()">+</button>
        </div>

        <div class="tasks-list" id="tasks-list"></div>
      </div>

      <!-- ПРАВАЯ КОЛОНКА -->
      <div style="display: flex; flex-direction: column; gap: 20px;">

        <!-- ПОМОДОРО ТАЙМЕР -->
        <div class="card pomodoro-box">
          <div class="card-title" style="width: 100%;">
            <span>Focus Timer</span>
            <span style="font-size: 0.8rem; color: var(--text-muted);">25 мин фокуса</span>
          </div>

          <div class="timer-display" id="timer">25:00</div>

          <div class="timer-controls">
            <button class="btn" id="start-btn" onclick="toggleTimer()">Старт</button>
            <button class="btn btn-secondary" onclick="resetTimer()">Сброс</button>
          </div>
        </div>

        <!-- ЗВУКИ ДЛЯ КОНЦЕНТРАЦИИ (NEW) -->
        <div class="card">
          <div class="card-title">
            <span>Фоновый Шум (Focus)</span>
          </div>
          <div class="sound-buttons">
            <button class="sound-btn" onclick="toggleNoise('rain', this)">🌧️ Дождь</button>
            <button class="sound-btn" onclick="toggleNoise('pink', this)">🎧 Розовый</button>
            <button class="sound-btn" onclick="toggleNoise('fire', this)">🔥 Камин</button>
          </div>
        </div>

        <!-- ТРЕКЕР ПРИВЫЧЕК -->
        <div class="card">
          <div class="card-title">Привычки</div>
          <div class="habits-list">
            <div class="habit-row">
              <span>📖 1 час English</span>
              <div class="habit-check" onclick="toggleHabit(this)">✓</div>
            </div>
            <div class="habit-row">
              <span>💻 1 час Кодинг</span>
              <div class="habit-check" onclick="toggleHabit(this)">✓</div>
            </div>
            <div class="habit-row">
              <span>📊 Анализ рынка</span>
              <div class="habit-check" onclick="toggleHabit(this)">✓</div>
            </div>
            <div class="habit-row">
              <span>🏃 Тренировка</span>
              <div class="habit-check" onclick="toggleHabit(this)">✓</div>
            </div>
          </div>
        </div>

        <!-- ЗАМЕТКИ -->
        <div class="card">
          <div class="card-title">Заметки</div>
          <textarea class="notes-area" id="quick-notes" placeholder="Важные мысли или ссылки на сегодня..." oninput="saveNotes()"></textarea>
        </div>

      </div>

    </div>

  </div>

  <script>
    // --- 1. ДАТА И ИНИЦИАЛИЗАЦИЯ ---
    const options = { weekday: 'long', month: 'long', day: 'numeric' };
    document.getElementById('current-date').innerText = new Date().toLocaleDateString('ru-RU', options);

    // --- 2. УПРАВЛЕНИЕ ЗАДАЧАМИ ---
    let tasks = JSON.parse(localStorage.getItem('daily_tasks_pro')) || [
      { id: 1, text: 'Выполнить час практики Английского', tag: 'English', completed: false },
      { id: 2, text: 'Разобрать код и сверстать проект', tag: 'Код', completed: false }
    ];

    let currentFilter = 'all';

    function saveAndRender() {
      localStorage.setItem('daily_tasks_pro', JSON.stringify(tasks));
      renderTasks();
      updateProgress();
    }

    function renderTasks() {
      const list = document.getElementById('tasks-list');
      list.innerHTML = '';

      const filtered = tasks.filter(t => {
        if (currentFilter === 'active') return !t.completed;
        if (currentFilter === 'completed') return t.completed;
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding: 20px;">Задач нет</div>`;
        return;
      }

      filtered.forEach(task => {
        const item = document.createElement('div');
        item.className = `task-item ${task.completed ? 'completed' : ''}`;
        item.innerHTML = `
          <div class="task-left">
            <div class="checkbox" onclick="toggleTask(${task.id})">${task.completed ? '✓' : ''}</div>
            <span class="task-text">${task.text}</span>
            <span class="tag">${task.tag}</span>
          </div>
          <button class="delete-btn" onclick="deleteTask(${task.id})">&times;</button>
        `;
        list.appendChild(item);
      });
    }

    function addTask() {
      const input = document.getElementById('task-input');
      const tag = document.getElementById('task-tag').value;
      const text = input.value.trim();

      if (text) {
        tasks.push({ id: Date.now(), text, tag, completed: false });
        input.value = '';
        saveAndRender();
      }
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveAndRender();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveAndRender();
    }

    function filterTasks(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderTasks();
    }

    // --- 3. ОБЩИЙ ПРОГРЕСС И СЕРИЯ (STREAK) ---
    function updateProgress() {
      const totalTasks = tasks.length;
      const completedTasks = tasks.filter(t => t.completed).length;
      
      const habits = document.querySelectorAll('.habit-check.done').length;
      const totalHabits = document.querySelectorAll('.habit-check').length;

      const totalItems = totalTasks + totalHabits;
      const completedItems = completedTasks + habits;

      const percent = totalItems > 0 ? Math.round((completedItems / totalItems) * 100) : 0;

      document.getElementById('progress-bar').style.width = percent + '%';
      document.getElementById('completion-stats').innerText = `${percent}% выполнено`;

      // Сохраняем и обновляем дневную серию
      checkStreak(completedItems > 0);
    }

    function checkStreak(hasActivity) {
      const lastActiveDate = localStorage.getItem('last_active_date');
      const todayStr = new Date().toDateString();
      let streak = parseInt(localStorage.getItem('user_streak') || '1');

      if (lastActiveDate !== todayStr && hasActivity) {
        localStorage.setItem('last_active_date', todayStr);
        streak += 1;
        localStorage.setItem('user_streak', streak);
      }
      document.getElementById('streak-counter').innerText = `🔥 ${streak} день серии`;
    }

    // --- 4. ПОМОДОРО ТАЙМЕР + ЗВУКОВОЙ СИГНАЛ ---
    let timerInterval = null;
    let timeLeft = 25 * 60;
    let isRunning = false;

    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      document.getElementById('timer').innerText = 
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function playBeep() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 note
      osc.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.8);
    }

    function toggleTimer() {
      const startBtn = document.getElementById('start-btn');
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.innerText = 'Продолжить';
      } else {
        isRunning = true;
        startBtn.innerText = 'Пауза';
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            playBeep();
            alert('Сессия фокуса завершена! Отдохни 5 минут.');
            resetTimer();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      timeLeft = 25 * 60;
      document.getElementById('start-btn').innerText = 'Старт';
      updateTimerDisplay();
    }

    // --- 5. ВЕБ-АУДИО ГЕНЕРАТОР ШУМА (БЕЗ ВНЕШНИХ ФАЙЛОВ) ---
    let audioCtx = null;
    let activeSource = null;
    let currentNoiseType = null;

    function toggleNoise(type, btn) {
      if (currentNoiseType === type) {
        stopNoise();
        btn.classList.remove('active');
        currentNoiseType = null;
        return;
      }

      stopNoise();
      document.querySelectorAll('.sound-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentNoiseType = type;

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      // Фильтр для имитации шума дождя/розового шума
      const filter = audioCtx.createBiquadFilter();
      filter.type = type === 'rain' ? 'lowpass' : 'bandpass';
      filter.frequency.value = type === 'rain' ? 800 : (type === 'fire' ? 300 : 1200);

      const gainNode = audioCtx.createGain();
      gainNode.gain.value = 0.15; // Безопасная громкость

      whiteNoise.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      whiteNoise.start();
      activeSource = whiteNoise;
    }

    function stopNoise() {
      if (activeSource) {
        activeSource.stop();
        activeSource = null;
      }
    }

    // --- 6. ТРЕКЕР ПРИВЫЧЕК И ЗАМЕТКИ ---
    function toggleHabit(el) {
      el.classList.toggle('done');
      updateProgress();
    }

    const notesArea = document.getElementById('quick-notes');
    notesArea.value = localStorage.getItem('quick_notes_pro') || '';

    function saveNotes() {
      localStorage.setItem('quick_notes_pro', notesArea.value);
    }

    // Запуск при загрузке
    renderTasks();
    updateProgress();
    updateTimerDisplay();
  </script>
</body>
